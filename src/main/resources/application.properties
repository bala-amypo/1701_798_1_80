# src/main/resources/application.properties
spring.application.name=demo
# Don't change the port
server.port = 9001
# for https
server.forward-headers-strategy=framework

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/data_pro?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=Amypo
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# JWT Configuration
jwt.secret=your-256-bit-secret-key-for-jwt-generation-must-be-at-least-32-characters-long
jwt.expiration=86400000

# Swagger Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ⬇️ ADD THESE NEW LINES BELOW ⬇️
# Database connection optimization (prevents 502 errors)
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=10000
spring.datasource.hikari.max-lifetime=1800000

# Startup safety settings
spring.main.lazy-initialization=true
spring.main.banner-mode=off
spring.jpa.properties.hibernate.connection.provider_disables_autocommit=true